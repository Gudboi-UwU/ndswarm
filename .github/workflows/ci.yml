name: ci

# Every push and pull request is checked. A green push to a channel branch is tagged and published:
#   dev     -> vX.Y.Z-dev.N  image :X.Y.Z-dev.N and :dev          (no GitHub Release)
#   staging -> vX.Y.Z-rc.N   image :X.Y.Z-rc.N and :staging       (GitHub pre-release)
#   main    -> vX.Y.Z        image :X.Y.Z and :latest             (GitHub Release)
# X.Y.Z is the next release: the patch after the latest final tag, or Chart.yaml appVersion when raised.
on:
  push:
    branches: [main, staging, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      - run: make build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make helm
      - run: git diff --exit-code deploy/k8s/ndswarm.yaml # the manifest must match the chart

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make e2e

  # Picks the version for a green push to dev, staging or main and tags the commit.
  tag:
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/dev","refs/heads/staging","refs/heads/main"]'), github.ref)
    needs: [check, helm, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release # one tag at a time, in push order
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Next version
        run: |
          case "$GITHUB_REF_NAME" in
            dev) channel=dev; suffix=-dev ;;
            staging) channel=staging; suffix=-rc ;;
            main) channel=release; suffix= ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          # A re-run of the same commit reuses its tag for this channel.
          if [ -n "$suffix" ]; then pattern="^v[0-9]+\.[0-9]+\.[0-9]+$suffix\.[0-9]+$"; else pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'; fi
          existing=$(git tag --points-at HEAD -l 'v*' | grep -E "$pattern" | head -1 || true)
          if [ -n "$existing" ]; then
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chart=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/ndswarm/Chart.yaml)
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$chart" | sort -V | tail -1)" != "$latest" ]; then
            base=$chart
          else
            base=$(echo "$latest" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          fi
          if [ -n "$suffix" ]; then
            n=$(git tag -l "v$base$suffix.*" | wc -l)
            next="$base$suffix.$((n + 1))"
          else
            next=$base
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$next" -m "ndswarm $next ($channel)"
          git push origin "v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Tagged v$next ($channel)" >> "$GITHUB_STEP_SUMMARY"

  # Tags pushed with GITHUB_TOKEN do not start workflows, so the release runs from here.
  release:
    needs: tag
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      channel: ${{ needs.tag.outputs.channel }}
