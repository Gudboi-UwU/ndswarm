name: ci

# Every push and pull request is checked. A green push to dev is released automatically:
# the next version is tagged and the release workflow publishes the image and the GitHub Release.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      - run: make build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make helm
      - run: git diff --exit-code deploy/k8s/ndswarm.yaml # the manifest must match the chart

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make e2e

  # Picks the version for a green dev push and tags the commit.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [check, helm, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-dev # one release at a time, in push order
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Next version
        run: |
          # Chart.yaml appVersion wins when someone bumped it (e.g. to 0.5.0); otherwise the patch goes up.
          chart=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/ndswarm/Chart.yaml)
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if existing=$(git tag --points-at HEAD -l 'v*' | head -1) && [ -n "$existing" ]; then
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT" # a re-run: this commit is already tagged
            exit 0
          fi
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$chart" | sort -V | tail -1)" != "$latest" ]; then
            next=$chart
          else
            next=$(echo "$latest" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$next" -m "ndswarm $next"
          git push origin "v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Tagged v$next" >> "$GITHUB_STEP_SUMMARY"

  # Tags pushed with GITHUB_TOKEN do not start workflows, so the release runs from here.
  release:
    needs: tag
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
