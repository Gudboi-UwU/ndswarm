name: release

# Publishes a version as a multi-arch image on GHCR. Channels (see ci.yml):
#   dev     -> image :<version> and :dev only
#   staging -> image :<version> and :staging, GitHub pre-release with bundles and Helm chart
#   release -> image :<version> and :latest, GitHub Release with bundles and Helm chart
# Runs from ci.yml after a green push (it tags the commit) or from a tag pushed by hand.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: Version to publish, without the v (the tag must exist)
        type: string
        required: true
      channel:
        description: dev, staging or release
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/gudboi-uwu/ndswarm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Version and channel
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          channel="$INPUT_CHANNEL"
          if [ -z "$channel" ]; then # a tag pushed by hand: the suffix says which channel
            case "$version" in *-dev.*) channel=dev ;; *-rc.*) channel=staging ;; *) channel=release ;; esac
          fi
          case "$channel" in dev) float=dev ;; staging) float=staging ;; *) float=latest ;; esac
          { echo "VERSION=$version"; echo "CHANNEL=$channel"; echo "FLOAT_TAG=$float"; } >> "$GITHUB_ENV"
          echo "Publishing ndswarm $version ($channel)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.FLOAT_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Offline bundles
        if: env.CHANNEL != 'dev'
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$VERSION"
            docker tag "$IMAGE:$VERSION" "ndswarm-$arch:$VERSION"
            deploy/bundle.sh "$VERSION" "ndswarm-$arch:$VERSION" "dist/$arch"
            mv "dist/$arch/ndswarm-$VERSION-bundle.tar.gz" "dist/ndswarm-$VERSION-linux-$arch-bundle.tar.gz"
            docker rmi "$IMAGE:$VERSION" >/dev/null
          done

      - name: Helm chart
        if: env.CHANNEL != 'dev'
        run: docker run --rm -v "$PWD:/w" -w /w alpine/helm:3.19.0 package deploy/helm/ndswarm -d dist --version "$VERSION" --app-version "$VERSION"

      - name: Publish the release
        if: env.CHANNEL != 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          ## Run it

          \`\`\`bash
          docker run -d -p 8089:8089 -v ndswarm-data:/data --ulimit nofile=65536:65536 $IMAGE:$VERSION
          \`\`\`

          With the demo and the dummy target: download the bundle for your machine below
          (\`linux-amd64\` for Intel/AMD, \`linux-arm64\` for ARM servers and Apple Silicon),
          unpack it and follow \`CARA-PAKAI.txt\`.
          NOTES
          pre=; [ "$CHANNEL" = staging ] && pre=--prerelease
          gh release create "v$VERSION" --title "ndswarm $VERSION" --notes-file notes.md --generate-notes --verify-tag $pre \
            "dist/ndswarm-$VERSION-linux-amd64-bundle.tar.gz" "dist/ndswarm-$VERSION-linux-arm64-bundle.tar.gz" "dist/ndswarm-$VERSION.tgz"
