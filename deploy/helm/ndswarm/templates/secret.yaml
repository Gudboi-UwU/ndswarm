{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ndswarm.fullname" . }}
  labels: {{- include "ndswarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  NDSWARM_ADMIN_USER: {{ .Values.auth.adminUser | quote }}
  NDSWARM_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  NDSWARM_SECRET_KEY: {{ .Values.auth.secretKey | quote }}
{{- end }}
