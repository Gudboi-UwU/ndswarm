# Quick start: docker compose -f deploy/docker-compose.yml up
# Then open http://localhost:8089, create the admin account and open the "Demo shop" project.
name: ndswarm

services:
  ndswarm:
    image: ${NDSWARM_IMAGE:-ndswarm:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${NDSWARM_PORT:-8089}:8089"
    environment:
      NDSWARM_DEMO: "true"
      NDSWARM_DEMO_TARGET: http://dummytarget:8090
    volumes:
      - ndswarm-data:/data
    # Lets tests reach APIs running on this computer as http://host.docker.internal:<port>
    # (Docker Desktop has it built in; plain Docker Engine on Linux needs this line).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    cpus: ${NDSWARM_CPUS:-0} # 0 = no limit; make bench sets 4 to measure under a fixed budget
    restart: unless-stopped
    depends_on:
      - dummytarget

  # A predictable target for the demo and the benchmark. Remove it when testing your own services.
  dummytarget:
    image: ${NDSWARM_IMAGE:-ndswarm:dev}
    entrypoint: ["/dummytarget", "-addr", ":8090"]
    healthcheck:
      disable: true
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    cpus: ${NDSWARM_CPUS:-0}
    restart: unless-stopped

volumes:
  ndswarm-data:
